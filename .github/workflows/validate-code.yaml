name: Validate Code Workflow

on:
  workflow_call: # Se llama desde el pipeline del cliente (ramas feature/* y fix/*)

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cliente
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: "Ejecutar tests (ahora reales: Jest + Supertest)"
        run: npm test

      - name: Build de la imagen (sin push, solo validación)
        run: |
          docker build -t test-image:latest .
          echo "Imagen construida exitosamente para validación."
